<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Pokeball Outer Border -->
  <circle cx="32" cy="32" r="30" fill="#0d1424" filter="url(#shadow)"/>
  
  <!-- Top Half (Iconic Red) -->
  <path d="M 4 32 A 28 28 0 0 1 60 32 Z" fill="#ee1515"/>
  <!-- Top Highlight -->
  <path d="M 12 20 A 24 24 0 0 1 52 20 A 26 26 0 0 0 12 20 Z" fill="#ffffff" opacity="0.3"/>

  <!-- Bottom Half (Clean White) -->
  <path d="M 4 32 A 28 28 0 0 0 60 32 Z" fill="#f8fafc"/>

  <!-- Center Black Dividing Band -->
  <rect x="2" y="29" width="60" height="6" fill="#0d1424"/>

  <!-- Outer Center Ring -->
  <circle cx="32" cy="32" r="13" fill="#0d1424"/>

  <!-- Inner Center Button -->
  <circle cx="32" cy="32" r="9.5" fill="#f8fafc" stroke="#233454" stroke-width="1.5"/>

  <!-- PB Monogram in Center Button -->
  <text x="32" y="36.5"
        text-anchor="middle"
        font-family="'Barlow Condensed', Impact, 'Arial Black', sans-serif"
        font-size="11.5"
        font-weight="900"
        letter-spacing="-0.5px"
        fill="#ee1515">PB</text>
</svg>